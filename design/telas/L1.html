<div class="frame"><div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #8A939B; font-family: 'Figtree', system-ui, -apple-system, sans-serif"><div style="height: 56px; display: flex; align-items: center; padding: 0 16px; background: #C9CED3; font: 700 16px/20px 'Figtree', system-ui, -apple-system, sans-serif; color: #3B4248">Ecos Literários</div><div style="position: absolute; top: 48px; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column"><div style="display: flex; justify-content: center; padding: 10px 0 6px"><div style="width: 40px; height: 4px; border-radius: 999px; background: #D3DAE0"></div></div><div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 12px"><h2 style="margin: 0; font: 700 20px/26px 'Figtree', system-ui, -apple-system, sans-serif; letter-spacing: -0.01em; color: #141A1F">Adicionar um livro</h2><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; cursor: pointer; box-sizing: border-box; background: #FFFFFF; color: #3A63B8; border: 1px solid #C6D6F2;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg><span>Fechar</span></button></div><div style="flex-grow: 1; overflow: hidden; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid #E7EBEF"><div style="display: flex; flex-direction: column; gap: 6px"><label for="mencionado" style="font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F">Mencionado por</label><p style="margin: 0; font: 400 13px/19px 'Figtree', system-ui, -apple-system, sans-serif; color: #47525C">Quem falou do livro no grupo.</p><div style="position: relative"><input id="mencionado" type="text" value="[seu nome]" placeholder="" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 40px 0 14px; border: 1px solid #D3DAE0; border-radius: 10px; background: #FFFFFF; font: 400 16px/24px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F" /><span style="position: absolute; right: 14px; top: 14px; color: #5F6B77; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></div></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="comentario" style="font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F">Comentário</label><p style="margin: 0; font: 400 13px/19px 'Figtree', system-ui, -apple-system, sans-serif; color: #47525C">Os comentários aparecem no eco da semana, no catálogo.</p><textarea id="comentario" rows="3" placeholder="" style="box-sizing: border-box; width: 100%; height: 98px; padding: 12px 14px; border: 1px solid #D3DAE0; border-radius: 10px; background: #FFFFFF; font: 400 16px/24px 'Figtree', system-ui, -apple-system, sans-serif; color: #5F6B77; resize: none"></textarea></div><section aria-label="Capa e dados" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid #E7EBEF; border-radius: 12px; background: #FFFFFF"><div style="display: flex; gap: 12px; align-items: flex-start"><div style="width: 48px; height: 72px; flex-shrink: 0; border-radius: 6px; border: 1px dashed #D3DAE0; display: flex; align-items: center; justify-content: center; color: #5F6B77; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 "><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 999px; font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; cursor: pointer; box-sizing: border-box; width: 100%; background: #3A63B8; color: #FFFFFF; border: 1px solid #3A63B8;"><span>Adicionar o livro</span></button><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; cursor: pointer; box-sizing: border-box; width: 100%; background: #FFFFFF; color: #3A63B8; border: 1px solid #C6D6F2;"><span>Cancelar</span></button><p style="margin: 0; font: 400 13px/19px 'Figtree', system-ui, -apple-system, sans-serif; color: #47525C; text-align: center">Faltam o formato e o gênero.</p></div></div></div></div>
