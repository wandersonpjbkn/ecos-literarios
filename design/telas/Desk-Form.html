<div class="frame"><div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #FBFCFD; font-family: 'Figtree', system-ui, -apple-system, sans-serif; display: flex"><div style="width: 96px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E7EBEF; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 24px"><div style="width: 48px; height: 48px; border-radius: 12px; background: #F4F6F8"></div><div style="width: 48px; height: 48px; border-radius: 12px; background: #F4F6F8"></div><div style="width: 48px; height: 48px; border-radius: 12px; background: #F4F6F8"></div><div style="width: 48px; height: 48px; border-radius: 12px; background: #F4F6F8"></div></div><div style="position: absolute; left: 96px; top: 0; right: 0; bottom: 0; background: rgba(20, 26, 31, 0.32)"></div><section style="position: absolute; left: 96px; top: 0; bottom: 0; width: 760px; background: #FFFFFF; box-shadow: 0 20px 48px rgba(6, 21, 27, 0.18); display: flex; flex-direction: column"><div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 32px 16px"><h2 style="margin: 0; font: 700 22px/28px 'Figtree', system-ui, -apple-system, sans-serif; letter-spacing: -0.01em; color: #141A1F">Adicionar um livro</h2><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; cursor: pointer; box-sizing: border-box; background: #FFFFFF; color: #3A63B8; border: 1px solid #C6D6F2;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg><span>Fechar</span></button></div><div style="flex-grow: 1; overflow: hidden; padding: 8px 32px 24px; display: flex; flex-direction: column; gap: 20px; border-top: 1px solid #E7EBEF"><div style="display: flex; flex-direction: column; gap: 6px"><label for="d-titulo" style="font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F">Título</label><div style="position: relative"><input id="d-titulo" type="text" value="Isadora Moon vai à escola" placeholder="" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 40px 0 14px; border: 1px solid #D3DAE0; border-radius: 10px; background: #FFFFFF; font: 400 16px/24px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F" /></div></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="d-autores" style="font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F">Autores</label><div style="position: relative"><input id="d-autores" type="text" value="Harriet Muncaster" placeholder="" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 40px 0 14px; border: 1px solid #D3DAE0; border-radius: 10px; background: #FFFFFF; font: 400 16px/24px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F" /><span style="position: absolute; right: 14px; top: 14px; color: #5F6B77; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></div></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="d-formato" style="font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F">Formato</label><div style="position: relative"><input id="d-formato" type="text" value="" placeholder="Escolher o formato" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 40px 0 14px; border: 1px solid #D3DAE0; border-radius: 10px; background: #FFFFFF; font: 400 16px/24px 'Figtree', system-ui, -apple-system, sans-serif; color: #5F6B77" /><span style="position: absolute; right: 14px; top: 14px; color: #5F6B77; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></div></div></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="d-genero" style="font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F">Gênero</label><div style="position: relative"><input id="d-genero" type="text" value="" placeholder="Escolher o gênero" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 40px 0 14px; border: 1px solid #D3DAE0; border-radius: 10px; background: #FFFFFF; font: 400 16px/24px 'Figtree', system-ui, -apple-system, sans-serif; color: #5F6B77" /><span style="position: absolute; right: 14px; top: 14px; color: #5F6B77; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></div></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="d-mencionado" style="font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F">Mencionado por</label><p style="margin: 0; font: 400 13px/19px 'Figtree', system-ui, -apple-system, sans-serif; color: #47525C">Quem falou do livro no grupo.</p><div style="position: relative"><input id="d-mencionado" type="text" value="[seu nome]" placeholder="" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 40px 0 14px; border: 1px solid #D3DAE0; border-radius: 10px; background: #FFFFFF; font: 400 16px/24px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F" /><span style="position: absolute; right: 14px; top: 14px; color: #5F6B77; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></div></div></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="d-comentario" style="font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F">Comentário</label><p style="margin: 0; font: 400 13px/19px 'Figtree', system-ui, -apple-system, sans-serif; color: #47525C">Os comentários aparecem no eco da semana, no catálogo.</p><textarea id="d-comentario" rows="3" placeholder="" style="box-sizing: border-box; width: 100%; height: 98px; padding: 12px 14px; border: 1px solid #D3DAE0; border-radius: 10px; background: #FFFFFF; font: 400 16px/24px 'Figtree', system-ui, -apple-system, sans-serif; color: #5F6B77; resize: none"></textarea></div><section aria-label="Capa e dados" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid #E7EBEF; border-radius: 12px; background: #FFFFFF"><div style="display: flex; gap: 12px; align-items: flex-start"><div style="width: 48px; height: 72px; flex-shrink: 0; border-radius: 6px; border: 1px dashed #D3DAE0; display: flex; align-items: center; justify-content: center; color: #5F6B77; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path></svg></div><div style="display: flex; flex-direction: column; gap: 4px"><div style="font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F">Capa e dados <span style="font-weight: 400; color: #5F6B77">(opcional)</span></div><p style="margin: 0; font: 400 13px/19px 'Figtree', system-ui, -apple-system, sans-serif; color: #47525C">A busca traz capa, sinopse, editora, páginas e ano. Tudo continua editável à mão.</p></div></div><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; cursor: pointer; box-sizing: border-box; width: 100%; background: #FFFFFF; color: #3A63B8; border: 1px solid #C6D6F2;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><span>Buscar capa e dados</span></button></section><button type="button" aria-expanded="false" style="display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 48px; padding: 0; border: 0; border-top: 1px solid #E7EBEF; background: transparent; cursor: pointer"><span style="font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; color: #141A1F">Mais sobre o livro <span style="font-weight: 400; color: #5F6B77">(opcional)</span></span><span style="color: #5F6B77; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></button></div><div style="padding: 16px 32px 24px; border-top: 1px solid #E7EBEF; display: flex; gap: 12px; justify-content: flex-end; background: #FFFFFF"><div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; width: 100%"><div style="display: flex; gap: 8px"><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; cursor: pointer; box-sizing: border-box; background: #FFFFFF; color: #3A63B8; border: 1px solid #C6D6F2;"><span>Cancelar</span></button><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 999px; font: 600 15px/20px 'Figtree', system-ui, -apple-system, sans-serif; cursor: pointer; box-sizing: border-box; background: #3A63B8; color: #FFFFFF; border: 1px solid #3A63B8;"><span>Adicionar o livro</span></button></div><p style="margin: 0; font: 400 13px/19px 'Figtree', system-ui, -apple-system, sans-serif; color: #47525C">Faltam o formato e o gênero.</p></div></div></section></div></div>
