<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Filtros — celular</title>
<style>x-dc{display:block}helmet{display:none}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Figtree', system-ui, sans-serif; background: #FBFCFD; color: #141A1F; }
a { color: #3A63B8; text-decoration: none; }
a:hover { color: #2B5192; }
</style>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Figtree', system-ui, sans-serif; background: #FBFCFD; color: #141A1F; }
a { color: #3A63B8; text-decoration: none; }
a:hover { color: #2B5192; }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #FBFCFD; overflow: hidden;">

  <!-- Catálogo atrás -->
  <div style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; display: flex; flex-direction: column;">
    <div style="height: 58px; background: #FFFFFF; border-bottom: 1px solid #E7EBEF; padding: 0 16px; display: flex; align-items: center;">
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #3A63B8;">Ecos Literários</span>
    </div>
    <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="min-height: 52px; background: #FFFFFF; border: 1px solid #D3DAE0; border-radius: 999px;"></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
        <div style="height: 250px; border-radius: 12px; background: #F4F6F8; border: 1px solid #E7EBEF;"></div>
        <div style="height: 250px; border-radius: 12px; background: #F4F6F8; border: 1px solid #E7EBEF;"></div>
      </div>
    </div>
  </div>

  <!-- Véu -->
  <div style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; background: rgba(20, 26, 31, 0.32);"></div>

  <!-- Painel -->
  <div style="position: absolute; left: 0; top: 68px; width: 390px; height: 776px; background: #FFFFFF; border-radius: 20px 20px 0 0; box-shadow: 0 -14px 44px rgba(20, 26, 31, 0.16); display: flex; flex-direction: column; overflow: hidden;">

    <div style="padding: 10px 0 4px; display: flex; justify-content: center; flex-shrink: 0;">
      <div style="width: 48px; height: 5px; border-radius: 999px; background: #D3DAE0;"></div>
    </div>

    <div style="padding: 8px 18px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E7EBEF; flex-shrink: 0;">
      <span style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #141A1F;">Filtros</span>
      <a href="Catalog.mobile.html" style="display: inline-flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 600; color: #47525C; border: 1px solid #D3DAE0; border-radius: 999px; padding: 12px 18px 12px 15px; min-height: 48px; box-sizing: border-box;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#47525C" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
        Fechar
      </a>
    </div>

    <div style="flex-grow: 1; padding: 18px; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
          <span style="font-size: 16px; font-weight: 600; color: #141A1F;">Formato</span>
          <span style="font-size: 14px; color: #5F6B77;">salvo na sua conta</span>
        </div>
        <div style="background: #F4F6F8; border: 1px solid #E7EBEF; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px;">
          <span style="font-size: 15px; line-height: 1.55; color: #47525C;">Você marcou que não lê <strong style="color: #141A1F; font-weight: 600;">mangás</strong> nem <strong style="color: #141A1F; font-weight: 600;">HQs</strong> — eles ficam fora sem precisar remarcar.</span>
          <button type="button" style="font-family: inherit; font-size: 15px; font-weight: 600; color: #3A63B8; background: #FFFFFF; border: 1px solid #C6D6F2; border-radius: 999px; padding: 12px 16px; min-height: 48px; cursor: pointer;">Mostrar tudo mesmo assim</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #E7EBEF; padding-top: 18px;">
        <span style="font-size: 16px; font-weight: 600; color: #141A1F;">Gênero</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <button type="button" style="font-family: inherit; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #3A63B8; border: 0; border-radius: 999px; padding: 11px 16px; min-height: 46px; cursor: pointer;">Ficção 41</button>
          <button type="button" style="font-family: inherit; font-size: 15px; font-weight: 500; color: #47525C; background: #FFFFFF; border: 1px solid #E7EBEF; border-radius: 999px; padding: 11px 16px; min-height: 46px; cursor: pointer;">Clássico <span style="color: #5F6B77;">27</span></button>
          <button type="button" style="font-family: inherit; font-size: 15px; font-weight: 500; color: #47525C; background: #FFFFFF; border: 1px solid #E7EBEF; border-radius: 999px; padding: 11px 16px; min-height: 46px; cursor: pointer;">Fantasia <span style="color: #5F6B77;">19</span></button>
          <button type="button" style="font-family: inherit; font-size: 15px; font-weight: 500; color: #47525C; background: #FFFFFF; border: 1px solid #E7EBEF; border-radius: 999px; padding: 11px 16px; min-height: 46px; cursor: pointer;">Não-ficção <span style="color: #5F6B77;">16</span></button>
          <button type="button" style="font-family: inherit; font-size: 15px; font-weight: 500; color: #47525C; background: #FFFFFF; border: 1px solid #E7EBEF; border-radius: 999px; padding: 11px 16px; min-height: 46px; cursor: pointer;">Terror <span style="color: #5F6B77;">9</span></button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #E7EBEF; padding-top: 18px;">
        <span style="font-size: 16px; font-weight: 600; color: #141A1F;">Quem mencionou</span>
        <div style="display: flex; flex-wrap: wrap; gap: 7px;">
          <sc-for list="{{pessoas}}" as="p" hint-placeholder-count="8">
            <button type="button" style="font-family: inherit; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; border-radius: 999px; padding: 5px 13px 5px 5px; min-height: 44px; cursor: pointer; color: {{p.ink}}; background: {{p.bg}}; border: 1px solid {{p.bd}};">
              <span style="width: 28px; height: 28px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E7EBEF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #5F6B77;">{{p.i}}</span>
              {{p.n}}
            </button>
          </sc-for>
        </div>
      </div>

    </div>

    <div style="padding: 14px 18px 22px; border-top: 1px solid #E7EBEF; background: #FBFCFD; display: flex; align-items: center; gap: 12px; flex-shrink: 0;">
      <button type="button" style="font-family: inherit; font-size: 16px; font-weight: 600; color: #47525C; background: #FFFFFF; border: 1px solid #D3DAE0; border-radius: 999px; padding: 15px 20px; min-height: 52px; cursor: pointer;">Limpar</button>
      <a href="Catalog.mobile.html" style="flex-grow: 1; font-size: 16px; font-weight: 600; color: #FFFFFF; background: #3A63B8; border-radius: 999px; padding: 15px 20px; min-height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">Ver os 6 livros</a>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
